<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- 圓角外框底座 -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#shieldBg)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- 六角星芒/雷達瞄準掃描網格 -->
  <polygon points="256,70 390,148 390,304 256,382 122,304 122,148" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="256" cy="226" r="100" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.3"/>

  <!-- 幾何雙翼 J 與 T 幾何切割重構 -->
  <!-- T 頂部銳角水平刃 -->
  <path d="M150 160 L362 160 L342 195 L170 195 Z" fill="#FFFFFF" />

  <!-- J 勾刀型動態弧刃 (JIMMY) -->
  <path d="M242 185 L276 185 L276 280 C276 335 235 365 175 355 C145 350 128 335 120 305 L155 295 C160 315 175 325 195 325 C220 325 242 310 242 275 Z" 
        fill="url(#emeraldTeal)" />

  <!-- T 右支柱 (TIAN) -->
  <path d="M285 195 L340 320 L305 335 L260 210 Z" fill="#06B6D4" opacity="0.9" />

  <!-- 無人機巡航定位指示標記 -->
  <polygon points="256,120 268,145 256,138 244,145" fill="#10B981"/>

  <!-- 底部 JIMMY TIAN 專屬立體字牌 -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">JIMMY TIAN</text>
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" font-weight="700" fill="#10B981" letter-spacing="4" text-anchor="middle">EDITION 2026</text>
</svg>